<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4 text-center">Add New Student</h2>
	<nav class="navbar navbar-expand-md bg-dark navbar-dark mb-4">
	            <!-- Brand -->
	            <a class="navbar-brand" href="#">Student Management System</a>

	            <!-- Toggler/collapsible Button -->
	            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
	                <span class="navbar-toggler-icon"></span>
	            </button>

	            <!-- Navbar links -->
	            <div class="collapse navbar-collapse" id="collapsibleNavbar">
	                <ul class="navbar-nav">
	                    <li class="nav-item">
	                        <a class="nav-link" th:href="@{/students}">Student Management</a>
	                    </li>
	                </ul>
	            </div>
	        </nav>
    <form th:action="@{/students}" th:object="${student}" method="post">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" placeholder="Enter first name" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}">
                <p th:errors="*{firstName}">Invalid first name</p>
            </div>
        </div>
        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" placeholder="Enter last name" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}">
                <p th:errors="*{lastName}">Invalid last name</p>
            </div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter email" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                <p th:errors="*{email}">Invalid email</p>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
